<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo - Multicartón</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="panel-controls">
        <div class="controls-row">
            <!-- Agregar Cartón -->
            <div class="control-group">
                <span class="control-label">Añadir:</span>
                <select class="select-carton" id="cartonSelect" aria-label="Selecciona un cartón para agregar">
                    <option value="21">Cartón 21 (Negro)</option>
                    <option value="4">Cartón 4 (Fucsia)</option>
                    <option value="30">Cartón 30 (Púrpura)</option>
                    <option value="9">Cartón 9 (Fucsia)</option>
                </select>
                <button class="btn-action" id="addCartonButton" type="button" aria-label="Agregar cartón">+ Agregar</button>
            </div>

            <!-- Acciones -->
            <div class="control-group">
                <button class="btn-action btn-reset" id="resetCardsButton" type="button" aria-label="Limpiar todos los cartones">Limpiar Todos</button>
            </div>
        </div>

        <div class="controls-row">
            <!-- Color de Fichas -->
            <div class="control-group">
                <span class="control-label">Fichas:</span>
                <div class="color-options" id="chipOptions" aria-label="Selector de color de fichas">
                    <button class="color-btn active" type="button" aria-label="Color rojo" title="Color rojo" data-fill="rgba(231, 76, 60, 0.85)" data-border="#ff6b6b" data-glow="rgba(231, 76, 60, 0.6)" style="background:#e74c3c;"></button>
                    <button class="color-btn" type="button" aria-label="Color azul" title="Color azul" data-fill="rgba(52, 152, 219, 0.85)" data-border="#5dade2" data-glow="rgba(52, 152, 219, 0.6)" style="background:#3498db;"></button>
                    <button class="color-btn" type="button" aria-label="Color verde" title="Color verde" data-fill="rgba(46, 204, 113, 0.85)" data-border="#58d68d" data-glow="rgba(46, 204, 113, 0.6)" style="background:#2ecc71;"></button>
                    <button class="color-btn" type="button" aria-label="Color rosa" title="Color rosa" data-fill="rgba(232, 67, 147, 0.85)" data-border="#fd79a8" data-glow="rgba(232, 67, 147, 0.6)" style="background:#e84393;"></button>
                    <button class="color-btn" type="button" aria-label="Color turquesa" title="Color turquesa" data-fill="rgba(0, 206, 201, 0.85)" data-border="#81ecec" data-glow="rgba(0, 206, 201, 0.6)" style="background:#00cec9;"></button>
                </div>
            </div>
        </div>

        <div class="controls-row">
            <!-- Patrones de Juego -->
            <div class="control-group">
                <span class="control-label">Modo:</span>
                <select class="select-carton" id="patternSelect" aria-label="Selecciona un patrón de juego">
                    <option value="none">Sin Guía</option>
                    <option value="line-h">Línea Horizontal</option>
                    <option value="line-v">Línea Vertical</option>
                    <option value="diag-l">Diagonal ↙</option>
                    <option value="diag-r">Diagonal ↘</option>
                    <option value="x">X (2 Diagonales)</option>
                    <option value="cross">Cruz</option>
                    <option value="b">Columna B</option>
                    <option value="i">Columna I</option>
                    <option value="n">Letra N</option>
                    <option value="g">Columna G</option>
                    <option value="o">Columna O</option>
                    <option value="t">Letra T (Fila Top + Centro)</option>
                    <option value="corners">4 Esquinas</option>
                    <option value="full">Cartón Completo</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Contenedor donde se generan los cartones -->
    <div class="cards-container" id="cardsContainer"></div>

    <script src="script.js"></script>
</body>
</html>
