<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo - Selector de Cartones</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* Ficha por defecto */
            --chip-color: rgba(231, 76, 60, 0.85);
            --chip-border: #ff6b6b;
            --chip-glow: rgba(231, 76, 60, 0.6);

            /* Cartón por defecto (21 - Negro) */
            --card-grad-1: #3a3f4d;
            --card-grad-2: #1a1c23;
            --card-border: #4a505d;
        }

        body {
            background: #0d0f12;
            background-image: radial-gradient(circle at 50% 50%, #1a1e26 0%, #0a0b0d 100%);
            color: #d1d5db;
            font-family: 'Arial Black', 'Impact', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }

        /* Controles de Selección */
        .panel-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            width: 100%;
            max-width: 380px;
        }

        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .control-label {
            font-family: Arial, sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0a6b0;
            font-weight: bold;
        }

        .select-carton {
            background: #1f232b;
            color: #fff;
            border: 1px solid #4a505d;
            padding: 6px 12px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 0.85rem;
            font-weight: bold;
            outline: none;
        }

        .color-options {
            display: flex;
            gap: 8px;
        }

        .color-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .color-btn:hover, .color-btn.active {
            transform: scale(1.25);
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
        }

        /* Cartón */
        .bingo-card {
            background: 
                radial-gradient(circle at 50% 0%, var(--card-grad-1) 0%, var(--card-grad-2) 70%),
                repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 4px);
            border: 4px solid var(--card-border);
            border-radius: 20px;
            padding: 18px;
            width: 100%;
            max-width: 380px;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.9),
                inset 0 1px 1px rgba(255,255,255,0.2),
                inset 0 -2px 5px rgba(0,0,0,0.8);
            transition: background 0.4s, border-color 0.4s;
        }

        .carton-header {
            text-align: right;
            font-size: 0.8rem;
            color: #a0a6b0;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 2px;
            font-family: Arial, sans-serif;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        .carton-header span {
            font-size: 1.4rem;
            color: #f3f4f6;
            font-family: 'Arial Black', sans-serif;
        }

        .bingo-title-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            text-align: center;
            font-size: clamp(2.3rem, 11vw, 3.4rem);
            line-height: 1;
            margin-bottom: 6px;
            background: linear-gradient(180deg, #ffffff 20%, #a1a8b8 50%, #4a505d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.9));
        }

        .ranges-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            text-align: center;
            font-size: clamp(0.5rem, 2.2vw, 0.68rem);
            color: #a0a6b0;
            margin-bottom: 12px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 7px;
        }

        /* Celdas */
        .cell {
            aspect-ratio: 1;
            width: 100%;
            background: radial-gradient(circle at 35% 35%, #2a2e38 0%, #121418 100%);
            border: 2px solid #363b45;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.2rem, 5.8vw, 1.7rem);
            color: #e5e7eb;
            cursor: pointer;
            user-select: none;
            position: relative;
            box-shadow: 
                inset 0 3px 5px rgba(255,255,255,0.15),
                inset 0 -3px 5px rgba(0,0,0,0.8),
                0 4px 6px rgba(0,0,0,0.6);
            transition: transform 0.1s ease;
        }

        .cell:active {
            transform: scale(0.92);
        }

        /* Ficha de marcado */
        .cell.marked::after {
            content: '';
            position: absolute;
            width: 82%;
            height: 82%;
            background-color: var(--chip-color);
            border-radius: 50%;
            border: 2px solid var(--chip-border);
            box-shadow: 
                0 0 10px var(--chip-glow),
                inset 0 2px 4px rgba(255,255,255,0.4);
            animation: popIn 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Casilla Central con solo el león */
        .cell.free-space {
            font-size: clamp(1.3rem, 6.5vw, 2rem);
            background: radial-gradient(circle at 35% 35%, #353a47 0%, #15171d 100%);
        }

        .controls {
            margin-top: 20px;
        }

        .btn-reset {
            background: linear-gradient(180deg, #2a2e38 0%, #1c1e24 100%);
            color: #d1d5db;
            border: 1px solid #4a505d;
            padding: 10px 24px;
            border-radius: 20px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1);
            transition: all 0.2s;
        }

        .btn-reset:active {
            transform: scale(0.95);
            background: #15171c;
        }
    </style>
</head>
<body>

    <div class="panel-controls">
        <!-- Selector de Cartón -->
        <div class="control-group">
            <span class="control-label">Cartón:</span>
            <select class="select-carton" id="cartonSelect" onchange="cargarCarton(this.value)">
                <option value="21">Cartón 21 (Negro)</option>
                <option value="4">Cartón 4 (Fucsia)</option>
                <option value="30">Cartón 30 (Púrpura)</option>
                <option value="9">Cartón 9 (Fucsia)</option>
            </select>
        </div>

        <!-- Selector de Fichas -->
        <div class="control-group">
            <span class="control-label">Fichas:</span>
            <div class="color-options" id="chipOptions">
                <button class="color-btn active" style="background:#e74c3c;" onclick="setChipColor('rgba(231, 76, 60, 0.85)', '#ff6b6b', 'rgba(231, 76, 60, 0.6)', this)"></button>
                <button class="color-btn" style="background:#3498db;" onclick="setChipColor('rgba(52, 152, 219, 0.85)', '#5dade2', 'rgba(52, 152, 219, 0.6)', this)"></button>
                <button class="color-btn" style="background:#2ecc71;" onclick="setChipColor('rgba(46, 204, 113, 0.85)', '#58d68d', 'rgba(46, 204, 113, 0.6)', this)"></button>
                <button class="color-btn" style="background:#e84393;" onclick="setChipColor('rgba(232, 67, 147, 0.85)', '#fd79a8', 'rgba(232, 67, 147, 0.6)', this)"></button>
                <button class="color-btn" style="background:#00cec9;" onclick="setChipColor('rgba(0, 206, 201, 0.85)', '#81ecec', 'rgba(0, 206, 201, 0.6)', this)"></button>
            </div>
        </div>
    </div>

    <div class="bingo-card">
        <div class="carton-header">CARTON <span id="cartonNum">21</span></div>
        
        <div class="bingo-title-grid">
            <span>B</span>
            <span>I</span>
            <span>N</span>
            <span>G</span>
            <span>O</span>
        </div>

        <div class="ranges-row">
            <span>1 AL 15</span>
            <span>16 AL 30</span>
            <span>31 AL 45</span>
            <span>46 AL 60</span>
            <span>61 AL 75</span>
        </div>

        <div class="bingo-grid" id="bingoGrid"></div>
    </div>

    <div class="controls">
        <button class="btn-reset" onclick="resetBoard()">Reiniciar Cartón</button>
    </div>

    <script>
        const cartones = {
            '21': {
                num: '21',
                theme: ['#3a3f4d', '#1a1c23', '#4a505d'],
                numeros: [
                    [14, 23, 41, 56, 63],
                    [9, 17, 33, 53, 66],
                    [10, 29, 'FREE', 47, 69],
                    [11, 30, 40, 51, 75],
                    [3, 18, 31, 54, 72]
                ]
            },
            '4': {
                num: '4',
                theme: ['#63284f', '#2b0f21', '#8c3f72'],
                numeros: [
                    [11, 21, 38, 60, 64],
                    [5, 30, 43, 51, 70],
                    [4, 16, 'FREE', 54, 65],
                    [9, 24, 44, 56, 63],
                    [12, 29, 35, 50, 62]
                ]
            },
            '30': {
                num: '30',
                theme: ['#382b5e', '#160f2a', '#58468c'],
                numeros: [
                    [10, 20, 31, 46, 69],
                    [8, 19, 39, 54, 75],
                    [12, 28, 'FREE', 50, 73],
                    [14, 26, 42, 56, 63],
                    [2, 30, 40, 58, 71]
                ]
            },
            '9': {
                num: '9',
                theme: ['#63284f', '#2b0f21', '#8c3f72'],
                numeros: [
                    [4, 19, 39, 50, 70],
                    [13, 26, 36, 49, 72],
                    [1, 16, 'FREE', 57, 69],
                    [10, 28, 32, 55, 61],
                    [8, 24, 45, 47, 64]
                ]
            }
        };

        function cargarCarton(id) {
            const data = cartones[id];
            
            document.getElementById('cartonNum').innerText = data.num;
            document.documentElement.style.setProperty('--card-grad-1', data.theme[0]);
            document.documentElement.style.setProperty('--card-grad-2', data.theme[1]);
            document.documentElement.style.setProperty('--card-border', data.theme[2]);

            const grid = document.getElementById('bingoGrid');
            grid.innerHTML = '';

            data.numeros.forEach(row => {
                row.forEach(val => {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    if (val === 'FREE') {
                        cell.classList.add('free-space');
                        cell.innerHTML = '🦁';
                    } else {
                        cell.innerText = val;
                    }
                    
                    cell.onclick = () => cell.classList.toggle('marked');
                    grid.appendChild(cell);
                });
            });
        }

        function resetBoard() {
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('marked'));
        }

        function setChipColor(fill, border, glow, btn) {
            document.documentElement.style.setProperty('--chip-color', fill);
            document.documentElement.style.setProperty('--chip-border', border);
            document.documentElement.style.setProperty('--chip-glow', glow);

            document.querySelectorAll('#chipOptions .color-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // Carga inicial
        cargarCarton('21');
    </script>
</body>
</html>
